[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliber"
version = "0.1.0"
description = "指标准星：离线指标定义、多实现一致性校验与报告工作台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
]

[project.scripts]
caliber = "cli.main:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app/core"]
branch = false
