description: 按区域与细分段对齐的收入明细，用于验证差异聚类归因。
unit: 元
grain: day
natural_keys:
  - region
  - segment
impls:
  - id: impl_a
    source: revenue_a
    sql_file: segment_revenue_impl_a.sql
  - id: impl_b
    source: revenue_b
    sql_file: segment_revenue_impl_b.sql
