# 合成 fixture：复合自然键对齐，两实现明细预期聚成三个差异簇
# 1) only_one_side：east/x1 仅 impl_a 存在
# 2) type_mismatch：north/m1（文本）、north/m2（NULL）与 impl_a 数值类型不一致
